plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.nucleoid.xyz/releases/' }
    maven { url 'https://jitpack.io' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation include("eu.pb4:polymer-core:${project.polymer_version}")
    implementation include("xyz.nucleoid:server-translations-api:${project.server_translation_api_version}")
    implementation include("eu.pb4:polymer-blocks:${project.polymer_version}")
    implementation include("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    implementation include("eu.pb4:polymer-resource-pack-extras:${project.polymer_version}")
    implementation include("eu.pb4:sgui:${project.sgui_version}")
    implementation include('com.google.code.gson:gson:2.13.1')
    implementation "maven.modrinth:unruled-api:${project.unruled_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/lifesteal.accesswidener")

    runs {
        create("gametestServer") {
            server()
            name = "Game Test Server"
            vmArg("-Dfabric-api.gametest")
            runDir = "run/gametestServer"
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_version", project.minecraft_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version,
                "minecraft_version": project.minecraft_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

tasks.register('generateDatapack', Zip) {
    group = "build"
    description = "Generates a Minecraft datapack from the Fabric mod resources"

    // Output ZIP name and location
    archiveFileName = "lifesteal-example-datapack.zip"
    destinationDirectory = project.layout.projectDirectory.asFile

    // Include resources/data/*
    from("src/main/resources/data") {
        into("data")
    }

    // Generate pack.mcmeta dynamically
    doFirst {
        def packMcmetaFile = layout.buildDirectory.file("generated/pack.mcmeta").get().asFile
        packMcmetaFile.parentFile.mkdirs()

        packMcmetaFile.text = """{
  "pack": {
    "pack_format": 48,
    "supported_formats": {
      "min_inclusive": 45,
      "max_inclusive": 99999
    },
    "description": "Example Datapack for LifeSteal by QPCrummer"
  }
}
"""
    }

    // Add pack.mcmeta to the root of the ZIP
    from(layout.buildDirectory.file("generated/pack.mcmeta")) {
        into("")
    }
}

